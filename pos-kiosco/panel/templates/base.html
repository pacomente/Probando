<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Panel de licencias{% endblock %}</title>
<style>
  :root { --verde: #1f6f5c; --rojo: #b00020; --gris: #6b7280; --borde: #e5e7eb; --fondo: #f6f8f7; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: #111; }
  header { background: var(--verde); color: #fff; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header form { margin-left: auto; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  th { color: var(--gris); font-weight: 600; }
  .tabla { overflow-x: auto; }
  .estado { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .activa { background: #dcfce7; color: #166534; }
  .suspendida { background: #fee2e2; color: var(--rojo); }
  .chico { color: var(--gris); font-size: 12px; }
  .clave { font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: .5px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  button, .boton { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--verde); background: var(--verde); color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  button.secundario { background: #fff; color: var(--verde); }
  button.peligro { background: var(--rojo); border-color: var(--rojo); }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 16px; }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .numeros div { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 12px; }
  .numeros b { display: block; font-size: 26px; }
  .aviso { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .alerta { color: var(--rojo); font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f1f5f9; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
{% if session.dentro %}
<header>
  <a href="/">Licencias</a>
  <a href="/nueva">+ Nueva licencia</a>
  <a href="/clave-publica">Clave pública</a>
  <form method="post" action="/salir"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secundario">Salir</button></form>
</header>
{% endif %}
<main>
  {% for mensaje in get_flashed_messages() %}<div class="aviso">{{ mensaje }}</div>{% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
