# Compila las apps de Cinetream para Android (celular y tele) y las publica en «Releases» del repositorio.
# Se baja el APK desde el celular o la tele, sin computadora.
name: Cinetream · apps para Android

on:
  push:
    paths:
      - 'cinetream/android/**'
      - 'cinetream/public/**'
      - '.github/workflows/cinetream-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinetream-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinetream/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Opcional: tu propia clave de firma, guardada en Settings → Secrets and variables → Actions
      - name: Clave de firma
        env:
          FIRMA_BASE64: ${{ secrets.CINETREAM_FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "CINETREAM_FIRMA_ARCHIVO=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave propia."
          else
            echo "Se firma con la clave de prueba del repositorio."
          fi

      - name: Compilar
        env:
          CINETREAM_FIRMA_CLAVE: ${{ secrets.CINETREAM_FIRMA_CLAVE }}
          CINETREAM_FIRMA_ALIAS: ${{ secrets.CINETREAM_FIRMA_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pcinetream.servidor="${{ vars.CINETREAM_SERVIDOR }}" \
            -Pcinetream.version="1.0.${{ github.run_number }}" \
            -Pcinetream.numero="${{ github.run_number }}"
          mkdir -p salida
          cp app/build/outputs/apk/celular/release/*.apk salida/cinetream-celular.apk
          cp app/build/outputs/apk/tele/release/*.apk salida/cinetream-tele.apk
          ls -lh salida

      - uses: actions/upload-artifact@v4
        with:
          name: cinetream-apk
          path: cinetream/android/salida/*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAMA="${GITHUB_REF_NAME//\//-}"
          TAG="cinetream-app-$RAMA"
          PREVIA=""; [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ] && PREVIA="--prerelease"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" salida/cinetream-celular.apk salida/cinetream-tele.apk \
            --target "$GITHUB_SHA" $PREVIA \
            --title "Cinetream para Android 1.0.${{ github.run_number }} ($GITHUB_REF_NAME)" \
            --notes "**cinetream-celular.apk**: para celulares y tablets con Android 6 o más nuevo.
          **cinetream-tele.apk**: para Android TV y Google TV (se instala con la app Downloader o un pendrive).

          Al abrirla, tocá «Buscar en mi wifi» para encontrar la PC con Cinetream, o escribí su dirección."
