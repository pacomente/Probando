org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Dirección del servidor de Cinetream que la app abre al empezar (vacío = la app pregunta y mientras muestra la demostración).
# Es la de Cinetream en Render. Desde Ajustes de la app se puede cambiar por otra (por ejemplo, la PC de casa).
# Se puede pasar al compilar: ./gradlew assembleRelease -Pcinetream.servidor=https://cine.tudominio.com
cinetream.servidor=https://cinestream-fsji.onrender.com
