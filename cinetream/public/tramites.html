<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinetream · Trámites</title>
  <meta name="theme-color" content="#0b0c11">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-simple">
  <main class="documento-legal">
    <span class="logo"><span class="logo-marca">CINE</span><span class="logo-sub">TREAM</span></span>
    <h1 id="titulo">Trámites</h1>
    <p id="bajada"></p>
    <div id="cuerpo"></div>
    <div id="historial"></div>
    <p class="pie-legal" style="justify-content:flex-start">
      <a href="tramites.html?tipo=baja">Botón de baja</a><a href="tramites.html?tipo=arrepentimiento">Botón de arrepentimiento</a>
      <a href="tramites.html?tipo=eliminar">Eliminar mi cuenta</a><a href="legal.html?doc=terminos">Términos y condiciones</a>
      <a href="legal.html?doc=privacidad">Privacidad</a><a href="./">Volver a Cinetream</a></p>
  </main>
  <script type="module">
    const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (s) => document.querySelector(s);
    const tipo = ['baja', 'arrepentimiento', 'eliminar'].includes(new URLSearchParams(location.search).get('tipo')) ? new URLSearchParams(location.search).get('tipo') : 'baja';
    const fecha = (ms) => new Date(ms).toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
    const pedir = async (ruta, cuerpo) => {
      const r = await fetch(`/api/${ruta}`, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'No se pudo completar. Probá de nuevo.');
      return d;
    };
    const TEXTOS = {
      baja: ['Botón de baja', 'Dá de baja tu suscripción en un paso. Se deja de renovar y seguís con tu plan hasta el último día pagado.'],
      arrepentimiento: ['Botón de arrepentimiento', 'Si contrataste un plan pago hace 10 días o menos, podés revocar la contratación sin dar motivos y te devolvemos el dinero.'],
      eliminar: ['Eliminar mi cuenta', 'Se borran tu cuenta y tus datos. Si tenés un plan pago, se cancela en el momento.'],
    };
    $('#titulo').textContent = TEXTOS[tipo][0];
    $('#bajada').textContent = TEXTOS[tipo][1];
    document.title = `Cinetream · ${TEXTOS[tipo][0]}`;

    const constancia = (codigo, texto) => `<div class="tramite-caja" role="status">
      <p>${texto}</p><p>Tu código de trámite:</p><p class="tramite-codigo">${esc(codigo)}</p>
      <p>Guardalo: es la constancia de tu pedido.</p></div>`;

    function ingresar() {
      $('#cuerpo').innerHTML = `<form class="tramite-caja form-simple" id="entrar">
        <p>Primero ingresá a tu cuenta.</p>
        <label for="email">Correo</label><input id="email" type="email" autocomplete="email" required>
        <label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required>
        <button class="btn principal">Ingresar</button><p class="error-cuenta" id="error" role="alert"></p>
        <p><a href="./">¿Olvidaste tu contraseña?</a> Ingresá a Cinetream y tocá «¿Olvidaste tu contraseña?».</p></form>`;
      $('#entrar').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await pedir('cuenta/entrar', { email: $('#email').value, clave: $('#clave').value }); iniciar(); } catch (err) { $('#error').textContent = err.message; }
      });
    }

    async function historial() {
      const { tramites } = await pedir('cuenta/tramites').catch(() => ({ tramites: [] }));
      const NOMBRES = { baja: 'Baja', arrepentimiento: 'Arrepentimiento', eliminacion: 'Eliminación de cuenta' };
      $('#historial').innerHTML = tramites.length ? `<h2>Tus trámites</h2><ul>${tramites.map((t) => `<li><b>${esc(t.codigo)}</b> · ${esc(NOMBRES[t.tipo] || t.tipo)} · ${esc(fecha(t.fecha))} · ${t.estado === 'resuelto' ? 'Resuelto' : 'En curso'}</li>`).join('')}</ul>` : '';
    }

    async function iniciar() {
      const { cuenta } = await pedir('cuenta/yo').catch(() => ({ cuenta: null }));
      if (!cuenta) { ingresar(); return; }
      const paga = cuenta.plus && cuenta.vence;
      const cuerpo = $('#cuerpo');
      if (tipo === 'baja') {
        if (!paga) cuerpo.innerHTML = `<div class="tramite-caja"><p>Tu cuenta <b>${esc(cuenta.email)}</b> está en el plan Gratis: no tenés una suscripción paga para dar de baja.</p><p>Si querés borrar tu cuenta, usá <a href="tramites.html?tipo=eliminar">Eliminar mi cuenta</a>.</p></div>`;
        else if (cuenta.estado === 'cancelada') cuerpo.innerHTML = `<div class="tramite-caja"><p>Tu suscripción <b>${esc(cuenta.planNombre)}</b> ya está dada de baja: no se renueva y la podés usar hasta el <b>${esc(fecha(cuenta.vence))}</b>.</p></div>`;
        else {
          cuerpo.innerHTML = `<div class="tramite-caja"><p>Cuenta: <b>${esc(cuenta.email)}</b> · Plan <b>${esc(cuenta.planNombre)}</b> · se renueva el ${esc(fecha(cuenta.vence))}.</p>
            <p>Al darla de baja no se te cobra más y seguís viendo con ${esc(cuenta.planNombre)} hasta el <b>${esc(fecha(cuenta.vence))}</b>. Después pasás al plan Gratis.</p>
            <button class="btn principal" id="accion">Dar de baja mi suscripción</button><p class="error-cuenta" id="error" role="alert"></p></div>`;
          $('#accion').addEventListener('click', async () => {
            try { const r = await pedir('cuenta/baja', {}); cuerpo.innerHTML = constancia(r.codigo, `Listo: tu suscripción quedó dada de baja. La podés usar hasta el <b>${esc(fecha(r.cuenta.vence))}</b> y no se te cobra más.`); historial(); } catch (err) { $('#error').textContent = err.message; }
          });
        }
      }
      if (tipo === 'arrepentimiento') {
        if (!paga) cuerpo.innerHTML = `<div class="tramite-caja"><p>Tu cuenta <b>${esc(cuenta.email)}</b> no tiene un plan pago contratado.</p></div>`;
        else {
          cuerpo.innerHTML = `<div class="tramite-caja"><p>Cuenta: <b>${esc(cuenta.email)}</b> · Plan <b>${esc(cuenta.planNombre)}</b>.</p>
            <p>Al confirmar, tu plan se cancela <b>en el momento</b> (pasás al plan Gratis) y te devolvemos lo que pagaste por el mismo medio de pago.
              Solo vale dentro de los 10 días corridos desde que lo contrataste.</p>
            <button class="btn principal" id="accion">Me arrepiento: cancelar y pedir la devolución</button><p class="error-cuenta" id="error" role="alert"></p></div>`;
          $('#accion').addEventListener('click', async () => {
            try { const r = await pedir('cuenta/arrepentimiento', {}); cuerpo.innerHTML = constancia(r.codigo, 'Listo: cancelamos tu plan. Vamos a devolverte el dinero por el mismo medio de pago; puede tardar unos días hábiles según tu banco o tarjeta.'); historial(); } catch (err) { $('#error').textContent = err.message; }
          });
        }
      }
      if (tipo === 'eliminar') {
        cuerpo.innerHTML = `<form class="tramite-caja form-simple" id="eliminar">
          <p>Vas a eliminar la cuenta <b>${esc(cuenta.email)}</b>${paga ? ` y cancelar tu plan <b>${esc(cuenta.planNombre)}</b> (no se devuelve lo ya pagado: para eso está el <a href="tramites.html?tipo=arrepentimiento">Botón de arrepentimiento</a>)` : ''}. No se puede deshacer.</p>
          <label for="clave">Escribí tu contraseña para confirmar</label><input id="clave" type="password" autocomplete="current-password" required>
          <button class="btn peligro">Eliminar mi cuenta para siempre</button><p class="error-cuenta" id="error" role="alert"></p></form>`;
        $('#eliminar').addEventListener('submit', async (e) => {
          e.preventDefault();
          try { const r = await pedir('cuenta/eliminar', { clave: $('#clave').value }); cuerpo.innerHTML = constancia(r.codigo, 'Listo: tu cuenta y tus datos fueron eliminados.'); $('#historial').innerHTML = ''; } catch (err) { $('#error').textContent = err.message; }
        });
      }
      historial();
    }
    iniciar();
  </script>
</body>
</html>
